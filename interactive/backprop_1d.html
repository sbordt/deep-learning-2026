<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Backprop 1D</title>
<!-- Backprop 1D: self-contained interactive for Deep Learning, Lecture 2 (computation graphs).
     Embed as an <iframe src="backprop_1d.html"> or paste the style block, markup and script block into your page. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Roboto+Mono:wght@400;500&display=swap">
<style>
/* Layout: one column; graph on top, step card below. Palette mirrors the lecture slides (green/orange/red nodes, red back-propagated, blue local). */
:root{
  --bg:#ffffff; --fg:#1f2626; --muted:#6a7c7c; --line:#d7e0e0; --panel:#f3f7f7; --panel-2:#e9f0f0;
  --accent:#36a8a1; --accent-fg:#ffffff;
  --red:#d7262d; --blue:#1e4fd6; --red-soft:rgba(215,38,45,.12); --blue-soft:rgba(30,79,214,.12);
  --node-in:#a9df7c; --node-par:#e8944b; --node-comp:#e46e60; --node-fg:#1a1a1a; --node-stroke:rgba(0,0,0,.18);
  --edge:#1f2626; --dim:#b7c4c4;
  --font:"Roboto",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Roboto Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131919; --fg:#e4ecec; --muted:#93a6a6; --line:#2a3838; --panel:#1b2424; --panel-2:#223030;
    --accent:#4fc9c0; --accent-fg:#0e1414;
    --red:#ff7a71; --blue:#86a8ff; --red-soft:rgba(255,122,113,.16); --blue-soft:rgba(134,168,255,.16);
    --node-in:#9bd470; --node-par:#e38f49; --node-comp:#e06b5d; --node-fg:#111; --node-stroke:rgba(255,255,255,.18);
    --edge:#e4ecec; --dim:#4a5c5c;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#131919; --fg:#e4ecec; --muted:#93a6a6; --line:#2a3838; --panel:#1b2424; --panel-2:#223030;
  --accent:#4fc9c0; --accent-fg:#0e1414;
  --red:#ff7a71; --blue:#86a8ff; --red-soft:rgba(255,122,113,.16); --blue-soft:rgba(134,168,255,.16);
  --node-in:#9bd470; --node-par:#e38f49; --node-comp:#e06b5d; --node-fg:#111; --node-stroke:rgba(255,255,255,.18);
  --edge:#e4ecec; --dim:#4a5c5c;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{height:100%}
body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.45;
  padding-block:20px 50vh;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 16px}
h1{font-size:22px;font-weight:500;margin:0;letter-spacing:-.01em;text-wrap:balance}
header p{margin:0;color:var(--muted);font-size:14px}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tab{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:999px;padding:7px 14px;font:inherit;font-size:14px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:500}
.tab:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.board{border:1px solid var(--line);border-radius:12px;background:var(--bg);overflow:hidden}
.board-head{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
.board-head .sub{font-size:14px;color:var(--muted);font-family:var(--mono)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.dot{width:11px;height:11px;border-radius:50%;display:inline-block;border:1px solid var(--node-stroke)}
.lg-red{color:var(--red);font-weight:500}.lg-blue{color:var(--blue);font-weight:500}
.controls{display:flex;flex-wrap:wrap;gap:8px 22px;padding:10px 16px;border-bottom:1px solid var(--line)}
.ctl{display:flex;align-items:center;gap:8px;font-size:14px}
.ctl label{min-width:1.6em;font-family:var(--mono)}
.ctl input[type=range]{width:120px;accent-color:var(--accent)}
.ctl .val{font-family:var(--mono);min-width:4.5em;text-align:right;font-variant-numeric:tabular-nums}
.ctl .seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.ctl .seg button{appearance:none;border:0;background:transparent;color:var(--fg);font:inherit;font-family:var(--mono);padding:3px 10px;cursor:pointer}
.ctl .seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.ctl .hint{color:var(--muted);font-size:12.5px}
.svgwrap{overflow-x:auto}
svg{display:block;width:100%;height:auto;min-width:560px;font-family:var(--font)}
svg text{fill:var(--fg)}
svg .nodelabel{fill:var(--node-fg);font-size:19px;font-weight:500}
svg .value{font-family:var(--mono);font-size:12.5px}
svg .grad{font-family:var(--mono);font-size:12.5px;fill:var(--red)}
svg .loc{font-size:12.5px;fill:var(--blue)}
svg .prod{font-size:12.5px;fill:var(--red)}
svg .done{opacity:.55}
.stepbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 16px;border-top:1px solid var(--line);background:var(--panel)}
.stepbar .spacer{flex:1}
.stepbar .pos{font-family:var(--mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
button.b{appearance:none;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:8px;padding:7px 12px;font:inherit;font-size:14px;cursor:pointer}
button.b.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:500}
button.b:disabled{opacity:.45;cursor:not-allowed}
.progress{height:4px;background:var(--panel-2);position:relative}
.progress i{position:absolute;inset:0 auto 0 0;background:var(--accent);transition:width .18s}
.progress i.bw{background:var(--red)}

.lower{display:grid;grid-template-columns:1.5fr 1fr;gap:16px}
@media (max-width:900px){.lower{grid-template-columns:1fr}}
/* attributes box: one row per node, x.value and x.grad as on the slides; fields the current step reads or writes are shaded */
.attrs{display:grid;grid-template-columns:repeat(2,max-content);gap:2px 18px;font-family:var(--mono);font-size:14px;font-variant-numeric:tabular-nums}
.attrs span{padding:1px 6px;border-radius:5px;white-space:nowrap}
.attrs .g{color:var(--red)}
.attrs .unset{color:var(--dim)}
.attrs .rd{background:var(--blue-soft)}
.attrs .wr{background:var(--red-soft);font-weight:500}
.card{border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0;background:var(--bg)}
.card h2{margin:0 0 8px;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500}
.eq{font-family:var(--mono);font-size:15px;line-height:1.7;overflow-x:auto;white-space:nowrap}
.eq .r{color:var(--red);font-weight:500}.eq .bl{color:var(--blue);font-weight:500}
.eq .m{color:var(--muted)}
.note{margin-top:8px;font-size:13.5px;color:var(--muted)}
.note b{color:var(--fg);font-weight:500}
.kind{font-size:14px;font-weight:500;margin:0 0 4px}
.kind.fw{color:var(--accent)}.kind.bw{color:var(--red)}
.summary{display:grid;gap:6px;font-family:var(--mono);font-size:14px}
details{margin-top:4px}
summary{cursor:pointer;color:var(--muted);font-size:13.5px}
pre{margin:8px 0 0;background:var(--panel);border-radius:8px;padding:10px 12px;font-family:var(--mono);font-size:12.5px;line-height:1.5;overflow-x:auto}
pre .c{color:var(--muted)}
kbd{font-family:var(--mono);font-size:12px;border:1px solid var(--line);border-radius:4px;padding:0 5px;background:var(--panel)}
@media (prefers-reduced-motion: reduce){.progress i{transition:none}}

/* page defaults when used standalone (the artifact host supplied these) */
html{color-scheme:light}
@media (prefers-color-scheme: dark){ html{color-scheme:dark} }
img{max-width:100%}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Backprop 1D</h1>
    <p>Step through the forward and backward pass on the computation graphs from Lecture 2. <kbd>→</kbd> step, <kbd>←</kbd> undo, <kbd>R</kbd> reset.</p>
  </header>

  <div class="tabs" role="tablist" id="tabs"></div>

  <div class="board">
    <div class="board-head">
      <div class="sub" id="sub"></div>
      <div class="legend">
        <span><i class="dot" style="background:var(--node-in)"></i>input</span>
        <span><i class="dot" style="background:var(--node-par)"></i>parameter</span>
        <span><i class="dot" style="background:var(--node-comp)"></i>compute</span>
        <span class="lg-red">red: back-propagated ∂ℒ/∂·</span>
        <span class="lg-blue">blue: local gradient</span>
      </div>
    </div>
    <div class="controls" id="controls"></div>
    <div class="svgwrap"><svg id="svg" viewBox="0 0 800 360" aria-label="computation graph"></svg></div>
    <div class="progress"><i id="prog" style="width:0%"></i></div>
    <div class="stepbar">
      <button class="b" id="btnReset" title="Reset (R)">Reset</button>
      <button class="b" id="btnBack" title="Undo one step (←)">◀ Back</button>
      <button class="b primary" id="btnStep" title="Next step (→)">Step ▶</button>
      <button class="b" id="btnRun">Run all</button>
      <span class="spacer"></span>
      <span class="pos" id="pos"></span>
    </div>
  </div>

  <div class="lower">
    <div class="card">
      <h2>Current step</h2>
      <div id="stepcard"></div>
    </div>
    <div class="card">
      <h2>Values and gradients</h2>
      <div class="attrs" id="attrs"></div>
    </div>
  </div>
</div>

<script>
(function(){
'use strict';
const sig = z => 1/(1+Math.exp(-z));
const F = v => { const r = Math.round(v*1000)/1000; return Number.isInteger(r) ? String(r) : r.toFixed(3).replace(/0+$/,'').replace(/\.$/,''); };
const P = v => (v < 0 ? '(' + F(v) + ')' : F(v));

/* ---------- graph definitions ---------- */
const GRAPHS = {
  warmup: {
    name: 'Warm-up', sub: 'ℒ = 2x²', loss: 'L',
    nodes: [
      { id:'x', kind:'input', label:'x', x:200, y:180, ctl:{min:-3,max:3,step:0.1,value:1.5} },
      { id:'y', kind:'compute', label:'y', x:400, y:180, parents:['x'], formula:'y = x²',
        fn:v=>v.x*v.x, num:v=>`${P(v.x)}²`,
        local:{ x:{ expr:'∂y/∂x = 2x', fn:v=>2*v.x, num:v=>`2·${P(v.x)}`, uses:['x'] } } },
      { id:'L', kind:'compute', label:'ℒ', x:600, y:180, parents:['y'], formula:'ℒ = 2y',
        fn:v=>2*v.y, num:v=>`2·${P(v.y)}`,
        local:{ y:{ expr:'∂ℒ/∂y = 2', fn:()=>2, num:()=>'2', uses:[] } } },
    ],
    check: (v,g)=>[`Closed form: dℒ/dx = 4x = ${F(4*v.x)} ✓`],
  },
  fanout: {
    name: 'Fan-out > 1', sub: 'ℒ = u·v with u = y², v = 3y, y = x + 1', loss:'L',
    nodes: [
      { id:'x', kind:'input', label:'x', x:110, y:180, ctl:{min:-3,max:3,step:0.1,value:0.5} },
      { id:'y', kind:'compute', label:'y', x:300, y:180, parents:['x'], formula:'y = x + 1',
        fn:v=>v.x+1, num:v=>`${P(v.x)} + 1`,
        local:{ x:{ expr:'∂y/∂x = 1', fn:()=>1, num:()=>'1', uses:[] } } },
      { id:'u', kind:'compute', label:'u', x:470, y:70, parents:['y'], formula:'u = y²',
        fn:v=>v.y*v.y, num:v=>`${P(v.y)}²`,
        local:{ y:{ expr:'∂u/∂y = 2y', fn:v=>2*v.y, num:v=>`2·${P(v.y)}`, uses:['y'] } } },
      { id:'v', kind:'compute', label:'v', x:470, y:290, parents:['y'], formula:'v = 3y',
        fn:v=>3*v.y, num:v=>`3·${P(v.y)}`,
        local:{ y:{ expr:'∂v/∂y = 3', fn:()=>3, num:()=>'3', uses:[] } } },
      { id:'L', kind:'compute', label:'ℒ', x:660, y:180, parents:['u','v'], formula:'ℒ = u·v',
        fn:v=>v.u*v.v, num:v=>`${P(v.u)}·${P(v.v)}`,
        local:{ u:{ expr:'∂ℒ/∂u = v', fn:v=>v.v, num:v=>`v = ${P(v.v)}`, uses:['v'] },
                v:{ expr:'∂ℒ/∂v = u', fn:v=>v.u, num:v=>`u = ${P(v.u)}`, uses:['u'] } } },
    ],
    check: (v,g)=>[`Closed form: ℒ = 3y³, so dℒ/dx = 9(x+1)² = ${F(9*(v.x+1)*(v.x+1))} ✓`,
                   `Both paths into y are summed: ${F(g.L.local.u.fn(v)*g.u.local.y.fn(v))} + ${F(g.L.local.v.fn(v)*g.v.local.y.fn(v))}`],
  },
  logistic: {
    name: 'Logistic regression', sub: 'ℒ = BCE(σ(w₀ + w₁x), y)', loss:'L',
    nodes: [
      { id:'x',  kind:'input', label:'x',  x:330, y:70,  ctl:{min:-3,max:3,step:0.1,value:1.5} },
      { id:'y',  kind:'input', label:'y',  x:730, y:70,  ctl:{toggle:[0,1],value:1} },
      { id:'w1', kind:'param', label:'w₁', x:130, y:190, ctl:{min:-2,max:2,step:0.1,value:-0.8} },
      { id:'w0', kind:'param', label:'w₀', x:130, y:310, ctl:{min:-2,max:2,step:0.1,value:0.4} },
      { id:'u', kind:'compute', label:'u', x:330, y:190, parents:['w0','w1','x'], formula:'u = w₀ + w₁·x',
        fn:v=>v.w0+v.w1*v.x, num:v=>`${P(v.w0)} + ${P(v.w1)}·${P(v.x)}`,
        local:{ w0:{ expr:'∂u/∂w₀ = 1', fn:()=>1, num:()=>'1', uses:[] },
                w1:{ expr:'∂u/∂w₁ = x', fn:v=>v.x, num:v=>`x = ${P(v.x)}`, uses:['x'] } } },
      { id:'yhat', kind:'compute', label:'ŷ', x:530, y:190, parents:['u'], formula:'ŷ = σ(u) = 1/(1+e⁻ᵘ)',
        fn:v=>sig(v.u), num:v=>`σ(${F(v.u)})`,
        local:{ u:{ expr:'∂ŷ/∂u = ŷ(1−ŷ)', fn:v=>v.yhat*(1-v.yhat), num:v=>`${F(v.yhat)}·(1−${F(v.yhat)})`, uses:['yhat'] } } },
      { id:'L', kind:'compute', label:'ℒ', x:730, y:190, parents:['yhat','y'], formula:'ℒ = −y·log ŷ − (1−y)·log(1−ŷ)',
        fn:v=>-(v.y*Math.log(v.yhat)+(1-v.y)*Math.log(1-v.yhat)),
        num:v=> v.y===1 ? `−log(${F(v.yhat)})` : `−log(1−${F(v.yhat)})`,
        local:{ yhat:{ expr:'∂ℒ/∂ŷ = (ŷ−y)/(ŷ(1−ŷ))', fn:v=>(v.yhat-v.y)/(v.yhat*(1-v.yhat)), num:v=>`(${F(v.yhat)}−${v.y})/(${F(v.yhat)}·(1−${F(v.yhat)}))`, uses:['yhat','y'] } } },
    ],
    check: (v,g)=>[`Closed form: ∇ℒ = (ŷ − y)·x`,
                   `∂ℒ/∂w₁ = (${F(v.yhat)} − ${v.y})·${P(v.x)} = ${F((v.yhat-v.y)*v.x)} ✓`,
                   `∂ℒ/∂w₀ = (${F(v.yhat)} − ${v.y})·1 = ${F(v.yhat-v.y)} ✓`],
  },
};
for (const g of Object.values(GRAPHS)) {
  g.byId = {}; g.nodes.forEach(n => { g.byId[n.id] = n; n.parents = n.parents || []; n.local = n.local || {}; });
  g.nodes.filter(n => n.ctl).forEach(n => n.ctl.value0 = n.ctl.value);
}

/* ---------- engine ---------- */
function buildSteps(g){
  const comps = g.nodes.filter(n => n.kind === 'compute');
  const steps = comps.map(n => ({ t:'fwd', n }));
  steps.push({ t:'init', n: g.byId[g.loss] });
  // backward: deepest nodes first, nodes of equal depth in forward order (ℒ→u, ℒ→v, u→y, v→y as on the slides)
  const depth = n => n.parents.length ? 1 + Math.max(...n.parents.map(p => depth(g.byId[p]))) : 0;
  [...comps].sort((a, b) => depth(b) - depth(a)).forEach(n => n.parents.forEach(p => { if (n.local[p]) steps.push({ t:'bwd', n, p: g.byId[p] }); }));
  return steps;
}
function evaluate(g){
  const v = {};
  g.nodes.forEach(n => { if (n.ctl) v[n.id] = n.ctl.value; });
  g.nodes.filter(n => n.kind === 'compute').forEach(n => { v[n.id] = n.fn(v); });
  return v;
}
const receivesGrad = (g, n) => g.nodes.some(c => c.local[n.id]);
// name of the node object, as in the implementation on the slides: L.value and L.grad, but ∂ℒ/∂u
const nm = (g, n) => n.id === g.loss ? 'L' : n.label;
const args = (g, n) => n.parents.map(p => `${nm(g, g.byId[p])}.value`).join(', ');
function computeState(g, k){
  const v = evaluate(g), steps = buildSteps(g);
  const shown = new Set(g.nodes.filter(n => n.ctl).map(n => n.id));
  const grad = {}, gradShown = new Set(), edgeDone = new Set();
  let active = null, prev = null, contrib = 0, loc = 0;
  for (let i = 0; i < k; i++){
    const s = steps[i];
    if (s.t === 'fwd') shown.add(s.n.id);
    else if (s.t === 'init'){ g.nodes.filter(n => receivesGrad(g, n)).forEach(n => { grad[n.id] = 0; }); grad[s.n.id] = 1; gradShown.add(s.n.id); }
    else { loc = s.n.local[s.p.id].fn(v); prev = grad[s.p.id] || 0; contrib = grad[s.n.id] * loc; grad[s.p.id] = prev + contrib; gradShown.add(s.p.id); edgeDone.add(s.n.id + '>' + s.p.id); }
    active = s;
  }
  const nFwd = steps.filter(s => s.t === 'fwd').length;
  return { v, steps, shown, grad, gradShown, edgeDone, active, prev, contrib, loc, nFwd, k, total: steps.length };
}

/* ---------- state ---------- */
let gid = 'logistic', k = 0, timer = null;
const $ = id => document.getElementById(id);

/* ---------- rendering: tabs & controls ---------- */
function renderTabs(){
  $('tabs').innerHTML = Object.entries(GRAPHS).map(([id,g]) =>
    `<button class="tab" role="tab" id="tab-${id}" aria-selected="${id===gid}" data-g="${id}">${g.name}</button>`).join('');
  $('tabs').querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => { stop(); gid = b.dataset.g; k = 0; renderAll(true); }));
}
function renderControls(){
  const g = GRAPHS[gid];
  $('controls').innerHTML = g.nodes.filter(n => n.ctl).map(n => {
    const c = n.ctl;
    if (c.toggle) return `<div class="ctl"><label for="ctl-${n.id}">${n.label}</label><span class="seg" id="ctl-${n.id}">${c.toggle.map(t =>
      `<button type="button" data-n="${n.id}" data-v="${t}" aria-pressed="${c.value===t}">${t}</button>`).join('')}</span><span class="hint">${n.kind}</span></div>`;
    return `<div class="ctl"><label for="ctl-${n.id}">${n.label}</label><input type="range" id="ctl-${n.id}" data-n="${n.id}" min="${c.min}" max="${c.max}" step="${c.step}" value="${c.value}"><span class="val" id="val-${n.id}">${F(c.value)}</span><span class="hint">${n.kind}</span></div>`;
  }).join('');
  $('controls').querySelectorAll('input[type=range]').forEach(inp => inp.addEventListener('input', () => {
    g.byId[inp.dataset.n].ctl.value = parseFloat(inp.value); $('val-'+inp.dataset.n).textContent = F(parseFloat(inp.value)); renderGraph(); renderPanels();
  }));
  $('controls').querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => {
    g.byId[b.dataset.n].ctl.value = parseFloat(b.dataset.v);
    b.parentElement.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b)); renderGraph(); renderPanels();
  }));
}

/* ---------- rendering: SVG ---------- */
const R = 26;
function renderGraph(){
  const g = GRAPHS[gid], st = computeState(g, k), a = st.active;
  const activeEdge = a && a.t === 'bwd' ? a.n.id + '>' + a.p.id : null;
  const activeNode = a ? (a.t === 'bwd' ? a.p.id : a.n.id) : null;
  const reads = new Set(a && a.t === 'bwd' ? a.n.local[a.p.id].uses : []);
  let out = `<defs>
    <marker id="mk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--edge)"/></marker>
    <marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--blue)"/></marker>
  </defs>`;
  // edges; their gradient labels are drawn at the origin and positioned by placeLabels
  const labels = [], segs = [];
  for (const n of g.nodes) for (const pid of n.parents){
    const p = g.byId[pid], dx = n.x - p.x, dy = n.y - p.y, len = Math.hypot(dx, dy), ux = dx/len, uy = dy/len;
    let nx = -uy, ny = ux; if (ny > 0 || (ny === 0 && nx < 0)) { nx = -nx; ny = -ny; }
    const x1 = p.x + ux*(R+3), y1 = p.y + uy*(R+3), x2 = n.x - ux*(R+4), y2 = n.y - uy*(R+4);
    const key = n.id + '>' + pid, done = st.edgeDone.has(key), isActive = key === activeEdge;
    out += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="var(--edge)" stroke-width="2" marker-end="url(#mk)"/>`;
    segs.push([x1, y1, x2, y2]);
    if (done || isActive){
      const off = 9, bx1 = x2 + nx*off, by1 = y2 + ny*off, bx2 = x1 + nx*off, by2 = y1 + ny*off;
      out += `<line class="${isActive ? '' : 'done'}" x1="${bx1}" y1="${by1}" x2="${bx2}" y2="${by2}" stroke="var(--blue)" stroke-width="${isActive ? 3 : 2}" marker-end="url(#mb)"/>`;
      segs.push([bx1, by1, bx2, by2]);
      const loc = n.local[pid];
      const body = isActive
        ? `<text x="0" y="0" text-anchor="middle"><tspan class="prod">∂ℒ/∂${n.label}</tspan><tspan class="loc"> · ${loc.expr.split(' = ')[0]}</tspan></text>
           <text x="0" y="15" text-anchor="middle" class="value"><tspan class="prod">${F(st.grad[n.id])}</tspan><tspan class="loc"> · ${P(st.loc)}</tspan> = ${F(st.contrib)}</text>`
        : `<text x="0" y="0" text-anchor="middle" class="value prod">${F(st.grad[n.id] * loc.fn(st.v))}</text>`;
      labels.push({ body, active: isActive, x1, y1, x2, y2, nx, ny });
    }
  }
  // nodes
  for (const n of g.nodes){
    const fill = n.kind === 'input' ? 'var(--node-in)' : n.kind === 'param' ? 'var(--node-par)' : 'var(--node-comp)';
    const isA = n.id === activeNode, isRead = reads.has(n.id);
    if (isRead) out += `<circle cx="${n.x}" cy="${n.y}" r="${R+7}" fill="none" stroke="var(--blue)" stroke-width="2" stroke-dasharray="4 4"/>`;
    out += `<circle cx="${n.x}" cy="${n.y}" r="${R}" fill="${fill}" stroke="${isA ? 'var(--fg)' : 'var(--node-stroke)'}" stroke-width="${isA ? 3 : 1.5}"/>
      <text x="${n.x}" y="${n.y+7}" text-anchor="middle" class="nodelabel">${n.label}</text>`;
    // value and gradient go under the node, or above it when an arrow leaves the node downwards
    const up = g.nodes.some(c => c.parents.includes(n.id) && c.y - n.y > Math.abs(c.x - n.x));
    const vy = up ? n.y - R - 13 : n.y + R + 21, gy = up ? vy - 15 : vy + 15;
    if (st.shown.has(n.id)) out += `<text x="${n.x}" y="${vy}" text-anchor="middle" class="value">${n.label} = ${F(st.v[n.id])}</text>`;
    else out += `<text x="${n.x}" y="${vy}" text-anchor="middle" class="value" fill="var(--dim)">${n.label} = ?</text>`;
    if (st.gradShown.has(n.id)) out += `<text x="${n.x}" y="${gy}" text-anchor="middle" class="grad">∂ℒ/∂${n.label} = ${F(st.grad[n.id])}</text>`;
  }
  out += labels.map((l, i) => `<g class="el${l.active ? '' : ' done'}" data-i="${i}">${l.body}</g>`).join('');
  // tall enough for the value and gradient lines under the lowest node
  $('svg').setAttribute('viewBox', `0 0 800 ${Math.max(360, Math.max(...g.nodes.map(n => n.y)) + R + 48)}`);
  $('svg').innerHTML = out;
  placeLabels(g, labels, segs);
  // progress
  const pct = st.total ? 100*k/st.total : 0, pr = $('prog'); pr.style.width = pct + '%'; pr.className = k > st.nFwd ? 'bw' : '';
  $('pos').textContent = k === 0 ? `0 / ${st.total}` : k <= st.nFwd ? `forward ${k} / ${st.nFwd}` : `backward ${k-st.nFwd} / ${st.total-st.nFwd}`;
  $('btnBack').disabled = k === 0; $('btnStep').disabled = k >= st.total;
  $('btnRun').textContent = timer ? 'Pause' : (k >= st.total ? 'Done' : 'Run all'); $('btnRun').disabled = k >= st.total && !timer;
}

/* ---------- edge-label placement ----------
   Each label is measured, then tried at a few spots along its edge (midpoint first, upper side first,
   then further away). The first spot that clears nodes, node texts, arrows, earlier labels and the
   drawing's border wins; if none does, the spot with the fewest collisions is used. */
function placeLabels(g, labels, segs){
  const svg = $('svg'), vb = svg.viewBox.baseVal, pad = 3;
  const boxes = [...svg.querySelectorAll(':scope > text')].map(t => { const b = t.getBBox(); return [b.x-pad, b.y-pad, b.x+b.width+pad, b.y+b.height+pad]; });
  const hitsRect = (r, q) => r[0] < q[2] && q[0] < r[2] && r[1] < q[3] && q[1] < r[3];
  const hitsNode = (r, n) => { const ex = n.x - Math.max(r[0], Math.min(n.x, r[2])), ey = n.y - Math.max(r[1], Math.min(n.y, r[3])); return ex*ex + ey*ey < (R+9)*(R+9); };
  const hitsSeg = (r, [ax, ay, bx, by]) => {   // Liang–Barsky: does the segment enter the rectangle?
    let t0 = 0, t1 = 1;
    for (const [p, q] of [[ax-bx, ax-r[0]], [bx-ax, r[2]-ax], [ay-by, ay-r[1]], [by-ay, r[3]-ay]]){
      if (p === 0){ if (q < 0) return false; continue; }
      const t = q/p;
      if (p < 0){ if (t > t1) return false; t0 = Math.max(t0, t); } else { if (t < t0) return false; t1 = Math.min(t1, t); }
    }
    return true;
  };
  const order = labels.map((l, i) => i).sort((i, j) => labels[j].active - labels[i].active);
  for (const i of order){
    const l = labels[i], el = svg.querySelector(`.el[data-i="${i}"]`), b = el.getBBox();
    const w = b.width, h = b.height, half = w/2*Math.abs(l.nx) + h/2*Math.abs(l.ny);
    let best = null;
    search:
    for (const extra of [0, 12, 26]) for (const t of [0.5, 0.35, 0.65, 0.2, 0.8]) for (const s of [1, -1]){
      const d = half + (s > 0 ? 16 : 7) + extra;   // the upper side also has to clear the blue arrow
      const cx = l.x1 + (l.x2-l.x1)*t + s*l.nx*d, cy = l.y1 + (l.y2-l.y1)*t + s*l.ny*d;
      const r = [cx - w/2 - pad, cy - h/2 - pad, cx + w/2 + pad, cy + h/2 + pad];
      let cost = 0;
      for (const q of boxes) if (hitsRect(r, q)) cost += 10;
      for (const n of g.nodes) if (hitsNode(r, n)) cost += 10;
      for (const sg of segs) if (hitsSeg(r, sg)) cost += 3;
      if (r[0] < 0 || r[1] < 0 || r[2] > vb.width || r[3] > vb.height) cost += 20;
      if (!best || cost < best.cost) best = { cost, cx, cy, r };
      if (cost === 0) break search;
    }
    el.setAttribute('transform', `translate(${best.cx - (b.x + w/2)},${best.cy - (b.y + h/2)})`);
    boxes.push(best.r);
  }
}

/* ---------- rendering: step card ---------- */
function renderPanels(){
  const g = GRAPHS[gid], st = computeState(g, k), a = st.active, v = st.v;
  let html = '';
  if (!a){
    html = `<p class="kind fw">Ready</p><div class="note">Set the leaves above, then press <b>Step</b>. The forward pass fills in one compute node per step; the backward pass then sends one gradient along one edge per step, from ℒ back to the parameters.</div>`;
  } else if (a.t === 'fwd'){
    html = `<p class="kind fw">Forward step ${k} of ${st.nFwd} · compute ${a.n.label}</p>
      <div class="eq">${nm(g, a.n)}.value = ${a.n.label}(${args(g, a.n)})<br>
      <span class="m">with ${a.n.formula}</span><br>
      ${nm(g, a.n)}.value = ${a.n.num(v)} = <b>${F(v[a.n.id])}</b></div>`;
  } else if (a.t === 'init'){
    const zero = g.nodes.filter(n => n.id !== g.loss && receivesGrad(g, n));
    html = `<p class="kind bw">Backward step 1 of ${st.total-st.nFwd} · initialize the gradients</p>
      <div class="eq">${zero.map(n => `<span class="r">${nm(g, n)}.grad</span>`).join(' = ')} = 0<br>
      <span class="r">L.grad</span> = <b>1</b></div>`;
  } else {
    const loc = a.n.local[a.p.id], bi = k - st.nFwd, nb = st.total - st.nFwd;
    // "∂u/∂w₁ = x = x = 1.5 = 1.5" → "∂u/∂w₁ = x = 1.5"
    const bare = t => t.replace(/^\((.*)\)$/, '$1');
    const chain = `${loc.expr} = ${loc.num(v)} = ${F(st.loc)}`.split(' = ').filter((t, i, ts) => i === 0 || bare(t) !== bare(ts[i-1])).join(' = ');
    html = `<p class="kind bw">Backward step ${bi} of ${nb} · ${a.n.label} → ${a.p.label}</p>
      <div class="eq"><span class="r">${nm(g, a.p)}.grad</span> += <span class="r">${nm(g, a.n)}.grad</span> * <span class="bl">(∂${a.n.label}/∂${a.p.label})(${args(g, a.n)})</span><br>
      <span class="m">local:</span> <span class="bl">${chain}</span><br>
      <span class="r">${nm(g, a.p)}.grad</span> = ${F(st.prev)} + <span class="r">${P(st.grad[a.n.id])}</span> * <span class="bl">${P(st.loc)}</span> = <b>${F(st.grad[a.p.id])}</b></div>`;
    if (k === st.total){
      const lines = g.check ? g.check(v, g.byId) : [];
      html += `<div class="note" style="margin-top:12px"><b>Backward pass complete.</b></div><div class="summary" style="margin-top:6px">${
        g.nodes.filter(n => st.gradShown.has(n.id)).map(n => `<span><span class="r" style="color:var(--red);font-weight:500">${nm(g, n)}.grad</span> = ∂ℒ/∂${n.label} = ${F(st.grad[n.id])}</span>`).join('')}</div>
        <div class="note">${lines.join('<br>')}</div>`;
    }
  }
  $('stepcard').innerHTML = html;
  renderAttrs(g, st);
}
function renderAttrs(g, st){
  const a = st.active, rd = new Set(), wr = new Set();
  if (a && a.t === 'fwd'){ wr.add(a.n.id + '.value'); a.n.parents.forEach(p => rd.add(p + '.value')); }
  else if (a && a.t === 'init') Object.keys(st.grad).forEach(id => wr.add(id + '.grad'));
  else if (a){ wr.add(a.p.id + '.grad'); rd.add(a.n.id + '.grad'); a.n.parents.forEach(p => rd.add(p + '.value')); }
  const cell = (n, f, known, val, cls) => `<span class="${cls}${known ? '' : ' unset'}${rd.has(n.id + f) ? ' rd' : ''}${wr.has(n.id + f) ? ' wr' : ''}">${nm(g, n)}${f} = ${known ? F(val) : '?'}</span>`;
  $('attrs').innerHTML = g.nodes.map(n => cell(n, '.value', st.shown.has(n.id), st.v[n.id], '')
    + (n.id === g.loss || receivesGrad(g, n) ? cell(n, '.grad', n.id in st.grad, st.grad[n.id], 'g') : '<span></span>')).join('');
}

/* ---------- stepping ---------- */
function total(){ return buildSteps(GRAPHS[gid]).length; }
function step(d){ const t = total(); const nk = Math.max(0, Math.min(t, k + d)); if (nk === k) return; k = nk; renderGraph(); renderPanels(); if (k >= t) stop(); }
function stop(){ if (timer){ clearInterval(timer); timer = null; } renderGraph(); }
function run(){
  if (timer){ stop(); return; }
  if (k >= total()) return;
  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce){ k = total(); renderGraph(); renderPanels(); return; }
  timer = setInterval(() => step(1), 900); renderGraph();
}
function renderAll(rebuild){
  if (rebuild){ renderControls(); renderTabs(); }
  $('sub').textContent = GRAPHS[gid].sub;
  renderGraph(); renderPanels();
}
$('btnStep').addEventListener('click', () => { stop(); step(1); });
$('btnBack').addEventListener('click', () => { stop(); step(-1); });
$('btnReset').addEventListener('click', () => { stop(); k = 0; renderAll(false); });
$('btnRun').addEventListener('click', run);
document.addEventListener('keydown', e => {
  if (e.target && /INPUT|TEXTAREA|BUTTON/.test(e.target.tagName) && e.target.type === 'range') return;
  if (e.key === 'ArrowRight'){ e.preventDefault(); stop(); step(1); }
  else if (e.key === 'ArrowLeft'){ e.preventDefault(); stop(); step(-1); }
  else if (e.key === 'r' || e.key === 'R'){ stop(); k = 0; renderAll(false); }
});

renderAll(true);
if (document.fonts) document.fonts.ready.then(renderGraph);   // label sizes change once the web font is in
})();
</script>

</body>
